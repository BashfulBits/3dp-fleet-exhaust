# Fan profile (schema: doc 13 §3). Copy this pack to fans/<vendor>_<model>/.
# Unknown keys are rejected.
schema: 1
id: vendor_model          # same as the folder name
name: Vendor Model
status: stub              # stub | designed | qualified (doc 13 §5)
family: pwm_4wire         # pwm_4wire | ec_0_10v | ec_usbc | ec_trrs
duct_in: 4                # 4 or 6
port: b2_pins_1_4         # b2_pins_1_4 | b2_terminal | b2_usbc | b2_trrs | fan_a
supply: fan_tap           # fan_tap | own_mains | own_brick | adapter_12v
tach_ppr: 2               # 0 if no tach
rated_rpm: null           # from FQ-3
# swap: straight          # USB-C jack only: straight | crossed (D98)
dc_filter: false          # DC jumper: a fan that reads 0-10 V but not PWM
printers: [1, 4]
# second_fan_from: 9      # fleet size from which a second fan is needed (FN-10)
